name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with coverage
        working-directory: lab1/rubiks_cube
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Build docs
        working-directory: lab1/rubiks_cube
        run: pdoc src -o docs

      - name: Build release artifact
        run: |
          mkdir -p dist
          cp -r lab1/rubiks_cube/src dist/src
          cp -r lab1/rubiks_cube/tests dist/tests
          cp lab1/rubiks_cube/pytest.ini dist/
          cp lab1/rubiks_cube/conftest.py dist/
          cp requirements.txt dist/
          cd dist && zip -r ../rubiks_cube.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rubiks_cube
          path: rubiks_cube.zip

  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: rubiks_cube

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab1-${{ github.run_number }}
          name: Lab 1 - Rubik's Cube (build ${{ github.run_number }})
          files: rubiks_cube.zip
