name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check . --ignore F401

      - name: Run Rubik's Cube tests
        working-directory: lab1/rubiks_cube
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Run Post Machine tests
        working-directory: lab1/post_machine
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Run Lab 2 Transport Company tests
        working-directory: lab2/transport_company
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Run Lab 3 Library System tests
        working-directory: lab3/library_system
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90
          
      - name: Build release artifact
        run: |
          # --- LAB 1 ---
          mkdir -p dist/lab1/rubiks_cube/src
          mkdir -p dist/lab1/post_machine/src
          
          cp lab1/rubiks_cube/src/*.py dist/lab1/rubiks_cube/src/
          cp lab1/post_machine/src/*.py dist/lab1/post_machine/src/
          
          cp -r lab1/rubiks_cube/tests dist/lab1/rubiks_cube/
          cp -r lab1/post_machine/tests dist/lab1/post_machine/
          
          cp lab1/rubiks_cube/pytest.ini dist/lab1/rubiks_cube/
          cp lab1/post_machine/pytest.ini dist/lab1/post_machine/
          
          cp lab1/rubiks_cube/conftest.py dist/lab1/rubiks_cube/
          cp lab1/post_machine/conftest.py dist/lab1/post_machine/
          
          # --- LAB 2 ---
          mkdir -p dist/lab2/transport_company/src
          mkdir -p dist/lab2/transport_company/src/exceptions
          
          cp lab2/transport_company/src/*.py dist/lab2/transport_company/src/
          cp lab2/transport_company/src/exceptions/*.py dist/lab2/transport_company/src/exceptions/
          
          cp -r lab2/transport_company/tests dist/lab2/transport_company/
          cp lab2/transport_company/pytest.ini dist/lab2/transport_company/
          cp lab2/transport_company/conftest.py dist/lab2/transport_company/ || true
          cp lab2/transport_company/.coveragerc dist/lab2/transport_company/
          
          # --- LAB 3 ---
          mkdir -p dist/lab3/library_system/src
          mkdir -p dist/lab3/library_system/src/exceptions
          
          cp lab3/library_system/src/*.py dist/lab3/library_system/src/
          cp lab3/library_system/src/exceptions/*.py dist/lab3/library_system/src/exceptions/
          
          cp -r lab3/library_system/tests dist/lab3/library_system/
          cp lab3/library_system/pytest.ini dist/lab3/library_system/
          cp lab3/library_system/conftest.py dist/lab3/library_system/ || true
          cp lab3/library_system/.coveragerc dist/lab3/library_system/
          
          # --- FINALIZE ---
          cp requirements.txt dist/
          cd dist && zip -r ../lab1_artifacts.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab1_artifacts
          path: lab1_artifacts.zip

  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lab1_artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab1-${{ github.run_number }}
          name: Lab 1, Lab 2 & Lab 3 - Complete Artifact (build ${{ github.run_number }})
          files: lab1_artifacts.zip
