name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check . --ignore F401

      - name: Run Rubik's Cube tests
        working-directory: lab1/rubiks_cube
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Run Post Machine tests
        working-directory: lab1/post_machine
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Run Lab 2 Transport Company tests
        working-directory: lab2/transport_company
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Build release artifact
        run: |
          mkdir -p dist/lab1/rubiks_cube dist/lab1/post_machine dist/lab2/transport_company/exceptions
          
          # Copy Lab 1 Rubik's Cube
          cp lab1/rubiks_cube/src/cube.py dist/lab1/rubiks_cube/
          cp lab1/rubiks_cube/src/cube_io.py dist/lab1/rubiks_cube/
          cp lab1/rubiks_cube/src/main.py dist/lab1/rubiks_cube/
          
          # Copy Lab 1 Post Machine
          cp lab1/post_machine/src/tape.py dist/lab1/post_machine/
          cp lab1/post_machine/src/rule.py dist/lab1/post_machine/
          cp lab1/post_machine/src/program.py dist/lab1/post_machine/
          cp lab1/post_machine/src/machine.py dist/lab1/post_machine/
          cp lab1/post_machine/src/machine_io.py dist/lab1/post_machine/
          cp lab1/post_machine/src/main.py dist/lab1/post_machine/
          
          # Copy Lab 2 Transport Company
          cp lab2/transport_company/src/*.py dist/lab2/transport_company/
          cp lab2/transport_company/src/exceptions/*.py dist/lab2/transport_company/exceptions/
          
          cp requirements.txt dist/
          
          # Zip the clean folder
          cd dist && zip -r ../lab1_artifacts.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab1_artifacts
          path: lab1_artifacts.zip

  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lab1_artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab1-${{ github.run_number }}
          name: Lab 1 & Lab 2 - Complete Artifact (build ${{ github.run_number }})
          files: lab1_artifacts.zip
