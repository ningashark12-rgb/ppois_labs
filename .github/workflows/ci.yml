name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run Rubik's Cube tests
        working-directory: lab1/rubiks_cube
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Run Post Machine tests
        working-directory: lab1/post_machine
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Build release artifact
        run: |
           # Create a temporary folder for the clean artifact
           mkdir -p dist/rubiks_cube dist/post_machine
          
           # Copy only the source code (excluding __pycache__)
           cp lab1/rubiks_cube/src/cube.py dist/rubiks_cube/
           cp lab1/rubiks_cube/src/cube_io.py dist/rubiks_cube/
           cp lab1/rubiks_cube/src/main.py dist/rubiks_cube/
          
           cp lab1/post_machine/src/tape.py dist/post_machine/
           cp lab1/post_machine/src/rule.py dist/post_machine/
           cp lab1/post_machine/src/program.py dist/post_machine/
           cp lab1/post_machine/src/machine.py dist/post_machine/
           cp lab1/post_machine/src/machine_io.py dist/post_machine/
           cp lab1/post_machine/src/main.py dist/post_machine/
          
           cp requirements.txt dist/
          
           # Zip the clean folder
           cd dist && zip -r ../lab1_artifacts.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab1_artifacts
          path: lab1_artifacts.zip

  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lab1_artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab1-${{ github.run_number }}
          name: Lab 1 - Rubiks Cube & Post Machine (build ${{ github.run_number }})
          files: lab1_artifacts.zip
